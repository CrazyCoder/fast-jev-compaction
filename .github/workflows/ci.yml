name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-wrapper:
    # tools/node.cmd must download, verify and run the pinned Node under bash
    # and under cmd.exe; the recall tool runs on it.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: tools/node.cmd under bash
        if: runner.os != 'Windows'
        run: bash tools/node.cmd -e "process.stdout.write(process.version)" | grep -x "v$(sed -n 's/^export TOOL_VERSION=\"\(.*\)\"/\1/p' tools/node.cmd)"
      - name: tools\node.cmd under cmd.exe
        if: runner.os == 'Windows'
        shell: cmd
        run: tools\node.cmd --version
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Line endings of .cmd files (through the pinned Node)
        run: bash tools/node.cmd scripts/check-polyglot-line-endings.ts
      - name: Duplicate code gate (jscpd)
        run: npx vitest run tests/jscpd.test.ts
      - run: npx vitest run --exclude tests/jscpd.test.ts
      - run: npm run check:version
      - name: Require a version bump for shipped changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          range="$BASE_SHA...$HEAD_SHA"
          shipped=false

          # Docs next to the code (hooks/README.md) do not reach the installed plugin's behavior.
          if [ -n "$(git diff --name-only "$range" -- src hooks ':(exclude,glob)**/*.md')" ]; then
            shipped=true
          fi

          if ! git diff --quiet "$range" -- .claude-plugin/plugin.json; then
            old=$(git show "$BASE_SHA:.claude-plugin/plugin.json" | node -e 'const c=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(JSON.stringify(c.userConfig??null))')
            new=$(node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json","utf8")).userConfig??null))')
            [ "$old" = "$new" ] || shipped=true
          fi

          if ! git diff --quiet "$range" -- package.json; then
            old=$(git show "$BASE_SHA:package.json" | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(JSON.stringify([p.dependencies??null,p.peerDependencies??null,p.optionalDependencies??null]))')
            new=$(node -e 'const p=JSON.parse(require("fs").readFileSync("package.json","utf8"));console.log(JSON.stringify([p.dependencies??null,p.peerDependencies??null,p.optionalDependencies??null]))')
            [ "$old" = "$new" ] || shipped=true
          fi

          if [ "$shipped" = false ]; then
            echo "No shipped files changed; no version bump required."
            exit 0
          fi

          base_version=$(git show "$BASE_SHA:.claude-plugin/plugin.json" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).version)')
          head_version=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json","utf8")).version)')
          if [ "$base_version" = "$head_version" ]; then
            echo "::error::bump the plugin version, or Claude Code will not deliver this change (plugin.json is still $head_version)"
            exit 1
          fi
          echo "Version bumped: $base_version -> $head_version"
