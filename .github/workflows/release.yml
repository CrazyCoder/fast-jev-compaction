name: Release

# A release is made by pushing a version tag (`git push origin v0.10.0`); see
# "Releasing" in the README. Pushes to main never release.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing: npm trusts this workflow (release.yml in
      # CrazyCoder/jetcompact) through GitHub's OIDC token; no npm token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - name: Check the tag matches every declared version
        run: |
          set -euo pipefail
          node scripts/check-version.mjs
          version=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json","utf8")).version)')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in plugin.json"
            exit 1
          fi
      - name: Take the release notes from the tag's CHANGELOG section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - run: npm ci
      # Before the GitHub release, so a version that fails to publish gets no
      # release. prepublishOnly runs the typecheck, the tests and the build. A
      # re-run after npm already took this version skips the publish.
      - name: Publish to npm
        run: |
          set -euo pipefail
          if npm view "jetcompact@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "jetcompact@${GITHUB_REF_NAME#v} is already on npm."
          else
            npm publish --provenance
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
